name: Сводка ошибок / Error summary
description: Обезличенная сводка из python scripts/share_errors.py — только названия классов ошибок из общего словаря и числа / Anonymous summary from python scripts/share_errors.py — only names of error classes from the shared dictionary and counts
title: "Сводка ошибок: "
labels: ["сводка ошибок", "в карантине"]
body:
  - type: markdown
    attributes:
      value: |
        **Всё, что вы отправите, сразу видно всем** — вместе с вашим логином GitHub. Вставляйте только вывод `python scripts/share_errors.py`: там версия навыков, дата, названия классов ошибок из общего словаря, их счёт и строка «прочие: N» — без текстов трейсов, путей, имён и названий проектов. Если заметили в сводке что-то личное — удалите до отправки.

        Класс попадает в разбор, только когда его принесли не меньше трёх разных людей. Сводки ничего не меняют сами: это сигнал, что класс стоит разобрать.

        **Everything you submit is public at once**, together with your GitHub login. Paste only the output of `python scripts/share_errors.py`: the skills version, the date, names of error classes from the shared dictionary, their counts and a line "прочие: N" ("other: N") — with no trace texts, paths, names or project names. If you notice anything personal, remove it before sending.

        A class is taken up for review only when at least three different people have submitted it. Summaries change nothing by themselves; they are a signal that a class is worth examining.
  - type: input
    id: version
    attributes:
      label: Версия навыков / Skills version
      description: Строка «версия навыков» из сводки / The "версия навыков" line of the summary
      placeholder: v0.5.1
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Сводка / Summary
      description: Вывод scripts/share_errors.py целиком, без правок / The output of scripts/share_errors.py as it is, without edits
      render: text
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Согласие / Consent
      options:
        - label: Я проверил, что в сводке нет личных данных (только названия классов из словаря и числа), и согласен, что числа из неё будут учтены в общем подсчёте и опубликованы в обобщённом виде под CC0. / I have checked that the summary contains no personal data (only class names from the dictionary and counts), and I agree that its numbers will be counted in the overall tally and published in aggregated form under CC0.
          required: true
